version: 2

linters:
  enable:
    - errcheck
    - govet
    - staticcheck      # absorbs gosimple in v2
    - unused
    - ineffassign
    - misspell
    - revive
    - gocritic
  exclusions:
    rules:                     # v2: exclusions is an OBJECT; rules is the array
      - path: _test\.go$
        linters:
          - errcheck
      - path: internal/leftover/whitelist\.go
        linters:
          - errcheck
      - path: internal/purge/config\.go
        linters:
          - errcheck
      - path: internal/tui/list\.go
        linters:
          - errcheck
  settings:
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/bavanchun/OmniClean
