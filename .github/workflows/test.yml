name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race "-coverprofile=coverage.out" ./...
      - name: Coverage total (report-only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go tool cover -func=coverage.out | tail -1
          # To enforce later, replace the line above with a threshold check:
          #   total=$(go tool cover -func=coverage.out | awk '/total:/{print substr($3,1,length($3)-1)}')
          #   awk -v t="$total" 'BEGIN{ exit (t+0 < 60) }' || { echo "coverage $total% < 60%"; exit 1; }
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  classify-smoke:
    name: Classify smoke (real apt)
    runs-on: ubuntu-latest
    # Soft-gated: a flaky orphan plant must not block merges. The unit `test`
    # matrix already pins parsing against captured fixtures; this job adds the
    # live-apt guarantee on a best-effort basis.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build binary
        run: go build -o bin/omniclean ./cmd/omniclean
      - name: Plant an orphaned apt dependency
        env:
          DEBIAN_FRONTEND: noninteractive
          LC_ALL: C
        run: |
          sudo apt-get update -qq
          # moreutils pulls a private dep (libipc-run-perl) that becomes
          # orphaned once moreutils is removed — a deterministic orphan.
          sudo apt-get install -y -qq moreutils
          sudo apt-get remove -y -qq moreutils
      - name: Run cleanup --json against real apt
        run: ./bin/omniclean cleanup --json --manager apt | tee out.json
      - name: Assert valid JSON with an orphan candidate
        run: |
          jq -e 'type == "array"' out.json
          jq -e 'any(.[]; .role == "orphan")' out.json \
            && echo "PASS: orphan detected by classifier" \
            || { echo "WARN: no orphan detected on this runner image"; exit 3; }
