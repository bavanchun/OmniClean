name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
        continue-on-error: true

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Build binary
        run: go build -o bin/omniclean ./cmd/omniclean

  classify-smoke:
    name: Classify smoke (real apt)
    runs-on: ubuntu-latest
    # Soft-gated: a flaky orphan plant must not block merges. The unit `test`
    # matrix already pins parsing against captured fixtures; this job adds the
    # live-apt guarantee on a best-effort basis.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Build binary
        run: go build -o bin/omniclean ./cmd/omniclean
      - name: Plant an orphaned apt dependency
        env:
          DEBIAN_FRONTEND: noninteractive
          LC_ALL: C
        run: |
          sudo apt-get update -qq
          # moreutils pulls a private dep (libipc-run-perl) that becomes
          # orphaned once moreutils is removed — a deterministic orphan.
          sudo apt-get install -y -qq moreutils
          sudo apt-get remove -y -qq moreutils
      - name: Run cleanup --json against real apt
        run: ./bin/omniclean cleanup --json --manager apt | tee out.json
      - name: Assert valid JSON with an orphan candidate
        run: |
          jq -e 'type == "array"' out.json
          jq -e 'any(.[]; .role == "orphan")' out.json \
            && echo "PASS: orphan detected by classifier" \
            || { echo "WARN: no orphan detected on this runner image"; exit 3; }
