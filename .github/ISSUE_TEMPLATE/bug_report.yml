name: Bug Report
description: File a bug report to help us improve OmniClean.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: system-info
    attributes:
      label: System & Version Info
      placeholder: e.g., macOS 14.5, OmniClean v0.5.0, go version go1.25.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug as clearly as possible.
      placeholder: What goes wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List the steps required to reproduce the behavior.
      placeholder: |
        1. Run `omniclean ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: e.g., OmniClean lists my package...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Console Output
      description: Provide terminal output or debug logs (run with `--verbose` if possible).
      render: shell
